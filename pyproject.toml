[project]
name = "koyori"
version = "0.1.0"
description = "Durable household control, sourced memory and controlled connectors for Koyori"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "boto3>=1.40,<2",
  "pyjwt[crypto]>=2.10,<3",
  "mangum>=0.19,<1",
  "tzdata>=2026.1,<2027",
  "httpx>=0.28,<1",
  "cryptography>=46,<51",
  "strands-agents>=1.57.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
infra = ["aws-cdk-lib>=2.200,<3", "constructs>=10,<11"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koyori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local DynamoDB and ElasticMQ"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
