name: Verify stages one, two and three
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.28"
      - run: uv sync --frozen --group infra
      - run: uv run python scripts/record_evidence.py --check-source
      - run: uv run ruff check src tests scripts infrastructure
      - run: uv run ruff format --check src tests scripts infrastructure
      - run: docker compose up -d --build
      - run: uv run python scripts/build_lambda.py
      - run: uv run python -m infrastructure.app
      - run: uv run pytest -q --junitxml=artifacts/all-tests.xml
        env:
          KOYORI_INTEGRATION: "1"
      - run: uv run python scripts/verify_local.py
      - run: uv run python scripts/verify_stage2.py
      - run: uv run python scripts/verify_stage3.py
      - run: uv run python -m pip_audit --path artifacts/lambda --format cyclonedx-json --output artifacts/runtime-sbom.json
      - run: uv run python scripts/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-verification
          path: |
            artifacts/all-tests.xml
            artifacts/local-recovery.json
            artifacts/stage2-recovery.json
            artifacts/stage3-recovery.json
            artifacts/runtime-sbom.json
            docs/verification/artifact-evidence.json
            cdk.out/KoyoriFoundation.template.json
          retention-days: 14
      - if: always()
        run: docker compose down
